[project]
name = "blessing-ai"
version = "0.1.0"
description = "Adaptive Basket Grid Trading System, Market Regime Engine, AI Grid Safety Score, and Portfolio Risk Governor for Binance Spot & USDⓈ-M Futures"
authors = [
    { name = "Principal Quant Engineer", email = "quant@blessing-ai.internal" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    # MVP Runtime & Testnet Native Execution
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiohttp>=3.11.0",
    "websockets>=13.1",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.12",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",

    # Core Logic / Matrix Arithmetic
    "numpy>=2.1.0",
    "scipy>=1.14.0",

    # Future Scale: Data & Analytics
    "polars>=1.14.0",
    "duckdb>=1.1.3",
    "pyarrow>=18.1.0",
    "pandas>=2.2.3",

    # Future Scale: Infrastructure
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "nats-py>=2.9.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "prometheus-client>=0.21.0",

    # Research / ML (Not critical path for execution MVP)
    "scikit-learn>=1.5.2",
    "catboost>=1.2.7",
    "xgboost>=2.1.2",
    "lightgbm>=4.5.0",
    "statsmodels>=0.14.4",
    "hmmlearn>=0.3.3",
    "optuna>=4.1.0",
    "mlflow>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
markers = [
    "contract_readonly: Read-only contract tests against Binance Testnet API",
    "contract_mutating: Mutating contract tests against Binance Testnet API"
]
