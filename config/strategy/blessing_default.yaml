# Blessing AI v0.1 Default Strategy Configuration
strategy_name: "Blessing_Adaptive_Basket"
version: "0.1.0"

# Basket Grid Settings
grid:
  max_levels: 5
  base_unit_size_usd: 1000.0  # Initial Level 1 notional
  volume_progression: [1.0, 1.0, 1.1, 1.2, 1.3]  # Anti-martingale progression
  level_spacing_multipliers: [1.0, 1.1, 1.3, 1.6, 2.0]
  take_profit_target_bps: 45.0  # +0.45% net profit target on total basket notional
  trailing_tp_enabled: true
  trailing_tp_callback_bps: 12.0

# Dynamic Volatility Spacing
spacing_atr_multipliers:
  R0_STRONG_MEAN_REVERSION: 0.70
  R1_RANGE: 0.90
  R2_WEAK_TREND: 1.20
  R3_STRONG_TREND: 1.60
  R4_BREAKOUT: null  # Disabled
  R5_VOLATILITY_SHOCK: 2.00
  R6_CRISIS: null  # Disabled

# AI Grid Safety Score Gating
safety_score_thresholds:
  grid_allowed_min: 80.0
  reduced_risk_min: 65.0
  conservative_min: 50.0
  recovery_only_min: 35.0
  no_new_grid_below: 35.0

# Funding Rate Filter
funding_filter:
  max_adverse_funding_rate_8h: 0.0003  # 0.03% / 8h (~32.8% APR drag)
  prefer_favorable_funding: true

# Basis Shock Filter
basis_filter:
  max_zscore_allowed: 2.5
