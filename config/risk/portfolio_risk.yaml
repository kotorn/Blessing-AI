# Portfolio Risk Governor Configuration
# Hard rules CANNOT be overridden by AI models or strategy modules.
risk_governor:
  version: "0.1.0"
  kill_switch_active: false

  # Hard Leverage Limits (Effective real exposure, not nominal UI setting)
  leverage:
    max_portfolio_leverage: 2.0
    btc_max_effective_leverage: 2.0
    eth_max_effective_leverage: 2.0
    sol_max_effective_leverage: 1.5
    bnb_max_effective_leverage: 2.0

  # Margin Utilization Constraints
  margin:
    normal_target_pct: 18.0
    stress_threshold_pct: 30.0
    extreme_hard_limit_pct: 40.0
    min_liquidation_distance_pct: 25.0

  # Equity Drawdown Escalation Tiers
  drawdown_escalation:
    caution_pct: 2.0        # State -> CAUTION
    no_new_grid_pct: 4.0    # State -> NO_NEW_GRID (freezes new basket entries)
    recovery_only_pct: 6.0  # State -> RECOVERY_ONLY (stops level expansion, works on partial reduction)
    emergency_stop_pct: 8.0 # State -> EMERGENCY (market cancels all and flattens positions)

  # Fail-Closed Infrastructure Constraints
  fail_closed:
    max_market_data_staleness_sec: 3.0
    max_private_ws_heartbeat_sec: 5.0
    require_reconciliation_on_reconnect: true
    block_entry_on_db_disconnect: true

  # Portfolio Correlation Limits
  correlation:
    max_btc_eth_rolling_corr: 0.88
    max_concurrent_crypto_beta_exposure_pct: 65.0
