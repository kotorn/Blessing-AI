substitutions:
  # The tag is only an artifact lookup handle. Release deployment must resolve
  # it to the immutable digest and pass that digest to deploy-control-plane.ps1.
  _IMAGE_TAG: 'control-plane-$BUILD_ID'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.control-plane'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/gen-lang-client-0730128480/blessing-repo/control-plane:${_IMAGE_TAG}'
      - '.'

images:
  - 'asia-southeast1-docker.pkg.dev/gen-lang-client-0730128480/blessing-repo/control-plane:${_IMAGE_TAG}'
timeout: '1200s'
