name: Blessing AI CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install Node Dependencies
      run: npm ci

    - name: Validate Firebase SQL Connect schema and generated SDK
      run: |
        npm run dataconnect:generate
        git diff --exit-code -- src/dataconnect-generated
      
    - name: TypeScript Lint
      run: npm run lint

    - name: TypeScript Unit Tests
      run: npm run test
      
    - name: TypeScript Build
      run: npm run build
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Python Unit Tests
      env:
        PYTHONPATH: .
      run: pytest tests/python/ -m "not contract_readonly and not contract_mutating and not contract_soak"
      
    - name: Hygiene Check
      run: |
        # Tests and package installs create ignored caches in the checkout.
        # Only tracked paths are repository artifacts and should fail this gate.
        if git ls-files | grep -E '(^|/)(patch_[^/]*\.(cjs|js|py)|fix_[^/]*\.py|__pycache__|\.pytest_cache)(/|$)|\.pyc$'; then
          echo "Hygiene failure: tracked patch scripts or cache artifacts found in source."
          exit 1
        fi
