name: Blessing AI CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install Node Dependencies
      run: npm ci
      
    - name: TypeScript Lint
      run: npm run lint

    - name: TypeScript Unit Tests
      run: npm run test
      
    - name: TypeScript Build
      run: npm run build
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic
        # pip install -e ".[dev]" if we had a setup.py, for now just requirements
        
    - name: Python Unit Tests
      env:
        PYTHONPATH: .
      run: pytest tests/python/
      
    - name: Hygiene Check
      run: |
        if find . -name "patch_*.cjs" | grep -q .; then
          echo "Hygiene failure: patch scripts found in source."
          exit 1
        fi
