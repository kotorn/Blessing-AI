name: Testnet Contract Tests

on:
  workflow_dispatch:
    inputs:
      allow_mutation:
        description: 'Allow mutating tests (e.g., place order)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'
      confirm_mutation:
        description: 'Type I_UNDERSTAND_TESTNET_MUTATION to authorize the one-order trial'
        required: false
        default: ''
        type: string
      allow_soak:
        description: 'Allow soak contract tests'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'
      confirm_soak:
        description: 'Type I_UNDERSTAND_TESTNET_SOAK to authorize supervised soak tests'
        required: false
        default: ''
        type: string

concurrency:
  group: testnet-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  contract_tests:
    runs-on: ubuntu-latest
    environment: testnet
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Non-Secret Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/python/ -m "not contract_readonly and not contract_mutating"

    - name: Verify Testnet credentials are configured
      env:
        BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
        BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      run: |
        if [ -z "$BINANCE_TESTNET_API_KEY" ] || [ -z "$BINANCE_TESTNET_API_SECRET" ]; then
          echo "::error::Binance Testnet credentials are not configured for this workflow"
          exit 1
        fi
        
    - name: Run Read-Only Contract Tests
      env:
        PYTHONPATH: .
        BINANCE_TESTNET: 'true'
        BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
        BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      run: |
        pytest -m "contract_readonly" tests/python/contract/

    - name: Record Current-SHA Testnet Evidence
      env:
        BUILD_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        sha = os.environ["BUILD_SHA"]
        ci_verified = False
        try:
            res = subprocess.run(
                [
                    "gh",
                    "run",
                    "list",
                    "--workflow=Blessing AI CI",
                    "--commit",
                    sha,
                    "--json",
                    "conclusion,status",
                ],
                capture_output=True,
                text=True,
                check=True,
            )
            runs = json.loads(res.stdout)
            ci_verified = any(
                r.get("status") == "completed" and r.get("conclusion") == "success"
                for r in runs
            )
        except Exception as exc:
            print(f"Warning: Exact-SHA CI verification check failed: {exc}")
            ci_verified = False

        evidence = {
            "build_sha": os.environ["BUILD_SHA"],
            "local_non_secret_tests_verified": True,
            "github_ci_verified": ci_verified,
            "readonly_contract_verified": True,
            "manual_trial_verified": False,
            "manual_trial_sha": None,
            "testnet_soak_verified": False,
            "testnet_soak_sha": None,
        }
        path = Path("artifacts") / "build-evidence.json"
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
        PY
        
    - name: Require explicit mutation confirmation
      if: github.event.inputs.allow_mutation == 'true'
      env:
        CONFIRM_MUTATION: ${{ github.event.inputs.confirm_mutation }}
      run: |
        if [ "$CONFIRM_MUTATION" != "I_UNDERSTAND_TESTNET_MUTATION" ]; then
          echo "::error::Mutating tests require the exact confirmation phrase"
          exit 1
        fi

    - name: Run Mutating Contract Tests
      if: github.event.inputs.allow_mutation == 'true' && github.event.inputs.confirm_mutation == 'I_UNDERSTAND_TESTNET_MUTATION'
      env:
        PYTHONPATH: .
        BINANCE_TESTNET: 'true'
        TESTNET_MANUAL_TRIAL_APPROVED: ${{ github.event.inputs.allow_mutation == 'true' && github.event.inputs.confirm_mutation == 'I_UNDERSTAND_TESTNET_MUTATION' }}
        BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
        BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      run: |
        pytest -m "contract_mutating" tests/python/contract/

    - name: Record Successful Current-SHA Manual Trial Evidence
      if: success() && github.event.inputs.allow_mutation == 'true' && github.event.inputs.confirm_mutation == 'I_UNDERSTAND_TESTNET_MUTATION'
      env:
        BUILD_SHA: ${{ github.sha }}
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        path = Path("artifacts") / "build-evidence.json"
        evidence = json.loads(path.read_text(encoding="utf-8"))
        evidence["manual_trial_verified"] = True
        evidence["manual_trial_sha"] = os.environ["BUILD_SHA"]
        path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
        PY

    - name: Require explicit soak confirmation
      if: github.event.inputs.allow_soak == 'true'
      env:
        CONFIRM_SOAK: ${{ github.event.inputs.confirm_soak }}
      run: |
        if [ "$CONFIRM_SOAK" != "I_UNDERSTAND_TESTNET_SOAK" ]; then
          echo "::error::Soak tests require the exact confirmation phrase"
          exit 1
        fi

    - name: Run Soak Contract Tests
      if: github.event.inputs.allow_soak == 'true' && github.event.inputs.confirm_soak == 'I_UNDERSTAND_TESTNET_SOAK'
      env:
        PYTHONPATH: .
        BINANCE_TESTNET: 'true'
        AUTONOMOUS_TESTNET_SOAK_APPROVED: 'true'
        TESTNET_LAUNCH_APPROVED: 'true'
        BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
        BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      run: |
        pytest -m "contract_soak" tests/python/contract/

    - name: Record Successful Current-SHA Soak Evidence
      if: success() && github.event.inputs.allow_soak == 'true' && github.event.inputs.confirm_soak == 'I_UNDERSTAND_TESTNET_SOAK'
      env:
        BUILD_SHA: ${{ github.sha }}
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        path = Path("artifacts") / "build-evidence.json"
        evidence = json.loads(path.read_text(encoding="utf-8"))
        evidence["testnet_soak_verified"] = True
        evidence["testnet_soak_sha"] = os.environ["BUILD_SHA"]
        path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
        PY

    - name: Upload Sanitized Testnet Evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: testnet-contract-evidence-${{ github.sha }}
        path: |
          artifacts/build-evidence.json
          artifacts/testnet-trial-*.json
          artifacts/testnet-soak-*.json
        if-no-files-found: ignore
