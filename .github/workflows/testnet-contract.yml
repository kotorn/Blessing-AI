name: Testnet Contract Tests

on:
  workflow_dispatch:

jobs:
  contract_tests:
    runs-on: ubuntu-latest
    environment: testnet
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic aiohttp websockets
        
    - name: Run Contract Tests
      env:
        PYTHONPATH: .
        BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
        BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      run: |
        pytest tests/python/contract/
