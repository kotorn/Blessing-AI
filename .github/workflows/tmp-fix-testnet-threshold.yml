name: Temporary Testnet threshold repair

on:
  push:
    branches:
      - codex/mainnet-risk-policy-20pct
    paths:
      - .github/workflows/tmp-fix-testnet-threshold.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mainnet-risk-policy-20pct
          fetch-depth: 0
      - name: Repair one Testnet fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/python/test_testnet_safety.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_testnet_risk_state_blocks_unsafe_account_metrics'
          before = text[:text.index(marker)]
          target = '("effective_leverage", Decimal(2))'
          if before.count(target) != 1:
              raise SystemExit(f'expected exactly one target before {marker}, found {before.count(target)}')
          before = before.replace(target, '("effective_leverage", Decimal(10))', 1)
          p.write_text(before + text[text.index(marker):], encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/python/test_testnet_safety.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/python/test_testnet_safety.py
          git commit -m "fix(test): restore Testnet leverage threshold fixture"
          git push origin HEAD:codex/mainnet-risk-policy-20pct
