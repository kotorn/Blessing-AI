name: Temporary Mainnet risk core migration

on:
  push:
    branches:
      - codex/mainnet-risk-policy-20pct
    paths:
      - .github/workflows/tmp-mainnet-risk-core-migration.yml

permissions:
  contents: write

jobs:
  patch-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mainnet-risk-policy-20pct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python tools/tmp_apply_mainnet_risk_core.py
      - name: Syntax and diff checks
        shell: bash
        run: |
          python -m compileall -q apps domain
          git diff --check
          git diff --stat
          git diff -- apps/trading_worker/main.py apps/trading_worker/engines/risk_governor.py apps/trading_worker/persistence/manager.py apps/trading_worker/persistence/postgres/repositories.py
      - name: Commit core wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/trading_worker/main.py apps/trading_worker/engines/risk_governor.py apps/trading_worker/persistence/manager.py apps/trading_worker/persistence/postgres/repositories.py
          git commit -m "feat(risk): wire durable baseline and 20pct emergency runtime"
          git push origin HEAD:codex/mainnet-risk-policy-20pct
