services:
  # ---------------------------------------------------------------------------
  # Core Infrastructure Bus & Storage
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: blessing-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: blessing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: blessing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase 0 & MVP Python Trading Services
  # ---------------------------------------------------------------------------
  blessing-market-data:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    container_name: blessing-market-data
    command: ["python", "-m", "data.collectors.binance_collector"]
    environment:
      - NATS_URL=nats://nats:4222
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:?POSTGRES_PORT must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PERSISTENCE_MODE=${PERSISTENCE_MODE:-OPTIONAL}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  blessing-trader:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    container_name: blessing-trader
    command: ["python", "-m", "apps.trading_worker.main"]
    environment:
      - NATS_URL=nats://nats:4222
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:?POSTGRES_PORT must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PERSISTENCE_MODE=${PERSISTENCE_MODE:-OPTIONAL}
      - REDIS_URL=redis://redis:6379/0
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - ACCOUNT_SNAPSHOT_MAX_AGE_SEC=${ACCOUNT_SNAPSHOT_MAX_AGE_SEC:-30}
      - MAX_MARKET_DATA_AGE_SEC=${MAX_MARKET_DATA_AGE_SEC:-3}
      - TESTNET_ALLOWED_SYMBOLS=${TESTNET_ALLOWED_SYMBOLS:-BTCUSDT}
      - TESTNET_LIMITS_OVERRIDE_APPROVED=${TESTNET_LIMITS_OVERRIDE_APPROVED:-false}
      - TESTNET_MAX_SINGLE_ORDER_NOTIONAL=${TESTNET_MAX_SINGLE_ORDER_NOTIONAL:-100}
      - TESTNET_MAX_TOTAL_OPEN_NOTIONAL=${TESTNET_MAX_TOTAL_OPEN_NOTIONAL:-100}
      - TESTNET_MAX_OPEN_ORDERS=${TESTNET_MAX_OPEN_ORDERS:-1}
      - TESTNET_MAX_ACTIVE_EXPOSURE_CHAINS=${TESTNET_MAX_ACTIVE_EXPOSURE_CHAINS:-1}
      - AUTONOMOUS_TESTNET_EXECUTION=${AUTONOMOUS_TESTNET_EXECUTION:-false}
      - TESTNET_LAUNCH_APPROVED=${TESTNET_LAUNCH_APPROVED:-false}
    depends_on:
      - nats
      - postgres
      - redis
    restart: unless-stopped

  blessing-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    container_name: blessing-control-api
    command: ["uvicorn", "apps.control_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:?POSTGRES_PORT must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - PERSISTENCE_MODE=${PERSISTENCE_MODE:-OPTIONAL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web Cockpit / Interactive Trader Dashboard
  # ---------------------------------------------------------------------------
  blessing-dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: blessing-dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Quant Research & Observability Stack
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: blessing-mlflow
    ports:
      - "5000:5000"
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: blessing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: blessing-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nats_data:
  postgres_data:
  redis_data:
  mlflow_data:
  grafana_data:
